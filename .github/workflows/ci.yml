name: CI
# Runs on pull requests and on the two permanent branches only, so Theme
# Editor saves on other branches don't start a run.
on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Runs the pinned Shopify CLI directly: shopify/theme-check-action@v2
      # crashes while reporting results ("e.filter is not a function") with
      # current CLI releases. Fails on errors; warnings are listed only.
      - name: Theme Check
        run: npx --yes @shopify/cli@4.9.4 theme check --path . --fail-level error
